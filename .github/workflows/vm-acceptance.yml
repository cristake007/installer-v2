name: Clean VM release gates (operator-provided disposable VMs)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-vm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu:22.04
            label: installer-v2-clean-ubuntu-2204
          - os: ubuntu:24.04
            label: installer-v2-clean-ubuntu-2404
          - os: debian:12
            label: installer-v2-clean-debian-12
          - os: debian:13
            label: installer-v2-clean-debian-13
    runs-on: [self-hosted, Linux, '${{ matrix.label }}']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap Docker and exercise full installer on clean VM
        run: |
          mkdir -p evidence
          set -o pipefail
          sudo bash tests/vm-acceptance.sh '${{ matrix.os }}' 2>&1 | tee evidence/vm-acceptance.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-${{ matrix.label }}
          path: evidence/
