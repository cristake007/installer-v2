name: Installer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    name: Syntax and essential unit checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash -n install.sh command.sh tests/run-integration.sh
          python3 -m compileall -q src tests tools
          python3 -m unittest discover -s tests -v
  smoke:
    name: Real Docker smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo bash tests/run-integration.sh /opt/installer-v2-smoke
