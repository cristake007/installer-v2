name: Installer CI (contracts, units and real Docker)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-ubuntu:
    name: "Python and safety tests / ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and unit tests
        run: |
          bash -n install.sh command.sh tests/run-integration.sh tests/vm-acceptance.sh
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Contract schema
        run: |
          python -m pip install jsonschema==4.23.0
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema=json.load(open('contracts/installer.schema.json'))
          data=json.load(open('contracts/installer.v1.json'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(data)
          print('JSON contract/schema valid')
          PY
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh command.sh tests/run-integration.sh tests/vm-acceptance.sh
  python-debian:
    name: "Unit tests / Debian ${{ matrix.version }} container"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['12', '13']
    container:
      image: "debian:${{ matrix.version }}"
    steps:
      - run: apt-get update && apt-get install -y git python3 bash ca-certificates
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh command.sh tests/run-integration.sh tests/vm-acceptance.sh
  compose-config:
    name: Compose rendering (not a live install)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate both web modes using Docker Compose
        run: |
          python3 - <<'PY'
          import pathlib, tempfile, sys
          sys.path.insert(0,'src')
          import installer
          with tempfile.TemporaryDirectory() as tmp:
              for mode in ('nginx','external'):
                  root=pathlib.Path(tmp)/mode
                  obj=type('Args',(),{'install_dir':str(root),'web_mode':mode,'http_port':8080,'fpm_port':9080})()
                  pin=lambda repo: repo+'@sha256:'+'a'*64
                  cfg=installer.settings(obj,{'app':pin('ghcr.io/cristake007/fluidweb'), 'postgres':pin('postgres'), 'redis':pin('redis'), 'nginx':pin('nginx')})
                  installer.make_layout(root,cfg)
                  installer.compose(root,'config','--quiet')
                  print(mode,'Compose config passed')
          PY
  real-docker:
    name: Real Docker installation and recovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install, persist, backup, restore, migrate and recover with real services
        run: |
          mkdir -p evidence
          set -o pipefail
          sudo bash tests/run-integration.sh /opt/installer-v2-ci 2>&1 | tee evidence/docker-integration.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-docker-${{ matrix.os }}
          path: evidence/
